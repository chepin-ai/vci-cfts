name: SSH-DEPLOYKEY-PROBE (DEPLOY_SSH_KEY对qfa域读权探·值不落盘)
'on':
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -u
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          for r in vci-qfa vci-qlv vci-lgt vci-cfts; do
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o BatchMode=yes" git ls-remote git@github.com:chepin-ai/$r.git HEAD >/tmp/o 2>/tmp/e; then
              echo "{\"$r\":\"READ-OK\"}"
            else
              echo "{\"$r\":\"NO: $(head -c 80 /tmp/e | tr -d '\n' | sed 's/\"/ /g')\"}"
            fi
          done
